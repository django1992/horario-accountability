<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horario de Accountability — Starlab</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --paper:#F6F3EC;
    --paper-2:#EFEAE0;
    --ink:#20281F;
    --ink-soft:#5B6157;
    --teal:#2F6F5E;
    --teal-dark:#204C40;
    --amber:#C1440E;
    --amber-bg:#F5DFCF;
    --red:#B23A2E;
    --red-bg:#F3DAD6;
    --line:#DAD3C4;
    --card:#FFFFFF;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
    padding:32px 24px 70px;
  }
  .wrap{max-width:900px;margin:0 auto;}

  header.top{
    border-bottom:2px solid var(--ink);
    padding-bottom:18px;
    margin-bottom:20px;
  }
  .brand-eyebrow{
    font-size:11px;letter-spacing:0.14em;text-transform:uppercase;
    color:var(--teal-dark);font-weight:600;margin-bottom:4px;
  }
  .admin-flag{color:var(--red);}
  h1{
    font-family:'Fraunces',serif;font-weight:600;
    font-size:clamp(26px,4vw,38px);margin:0 0 6px;letter-spacing:-0.01em;line-height:1.05;
  }
  .subtitle{color:var(--ink-soft);font-size:14px;margin:0;}

  .alert-banner{
    background:var(--red-bg);
    border:1px solid var(--red);
    color:var(--red);
    border-radius:var(--radius);
    padding:12px 16px;
    font-size:13.5px;
    font-weight:600;
    margin-bottom:20px;
    display:none;
  }
  .alert-banner.show{display:block;}
  .alert-banner ul{margin:6px 0 0;padding-left:18px;font-weight:500;}

  .tz-panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 18px;
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:28px;
  }
  .tz-panel label{
    font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;
    color:var(--ink-soft);
  }
  .tz-panel select{
    flex:1;min-width:220px;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:7px;
    font-family:inherit;
    font-size:14px;
    background:var(--paper);
    color:var(--ink);
  }
  .tz-panel select:focus{outline:2px solid var(--teal);outline-offset:1px;background:#fff;}
  .tz-base{font-size:12.5px;color:var(--ink-soft);}
  .tz-base strong{color:var(--ink);}
  .btn-mini{
    background:var(--paper-2);border:1px solid var(--line);border-radius:20px;
    padding:5px 12px;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;
  }
  .btn-mini:hover{background:var(--line);}

  .rail-note{font-size:11.5px;color:var(--ink-soft);margin:0 0 6px;}
  .week-rail{display:grid;grid-template-columns:56px 1fr;gap:0;margin:0 0 34px;}
  .rail-hours{
    grid-column:2;display:grid;font-size:10px;color:var(--ink-soft);
    padding:0 2px 6px 2px;border-bottom:1px solid var(--line);
  }
  .rail-day-label{
    font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;
    color:var(--ink-soft);padding:14px 8px 14px 0;display:flex;align-items:center;
  }
  .rail-track{position:relative;height:44px;border-bottom:1px solid var(--line);}
  .rail-block{
    position:absolute;top:6px;height:32px;background:var(--teal);border-radius:6px;color:#fff;
    font-size:11px;font-weight:600;display:flex;align-items:center;
    padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;
  }
  .rail-block:hover{background:var(--teal-dark);}
  .rail-block.cancelada{background:var(--red);text-decoration:line-through;opacity:0.75;}

  .list{display:flex;flex-direction:column;gap:10px;}
  .slot-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  }
  .slot-card.cancelada{background:var(--red-bg);border-color:var(--red);}
  .slot-day{font-family:'Fraunces',serif;font-weight:600;font-size:17px;min-width:130px;text-transform:capitalize;}
  .cancelada-text{text-decoration:line-through;color:var(--red) !important;font-weight:600;}
  .slot-time{font-size:13.5px;color:var(--ink-soft);min-width:120px;}
  .slot-shift{font-size:11px;color:var(--amber);font-weight:600;background:var(--amber-bg);padding:2px 8px;border-radius:20px;}
  .slot-cancel-tag{font-size:11.5px;color:var(--red);font-weight:700;background:#fff;padding:2px 8px;border-radius:20px;border:1px solid var(--red);}
  .slot-reason{font-size:12px;color:var(--red);width:100%;margin-top:-4px;}
  .slot-actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border:none;border-radius:7px;padding:9px 14px;font-size:13px;font-weight:600;
    cursor:pointer;text-decoration:none;transition:transform .08s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-teal{background:var(--teal);color:#fff;}
  .btn-teal:hover{background:var(--teal-dark);}
  .btn-ghost{background:var(--paper-2);color:var(--ink);}
  .btn-ghost:hover{background:var(--line);}
  .btn-red-outline{background:#fff;color:var(--red);border:1px solid var(--red);}
  .btn-red-outline:hover{background:var(--red-bg);}

  footer.note{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:36px;line-height:1.6;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand-eyebrow">Start Lab · Coach de Éxito<span id="adminFlag" class="admin-flag" style="display:none;"> · 🔒 Modo Admin — no compartir este link</span></div>
    <h1>Horario de Accountability</h1>
    <p class="subtitle">Bloques fijos de cada semana. Elige la zona horaria de tu cliente para ver el horario exacto.</p>
  </header>

  <div class="alert-banner" id="alertBanner">
    ⚠️ Hay sesión(es) cancelada(s) esta semana:
    <ul id="alertList"></ul>
  </div>

  <div class="tz-panel">
    <label for="tzSelect">Ver en zona horaria</label>
    <select id="tzSelect"></select>
    <button class="btn-mini" id="btnMiZona" type="button">Usar mi zona actual</button>
    <span class="tz-base" id="tzBase"></span>
  </div>

  <p class="rail-note" id="railNote">Franja visual convertida a la zona horaria elegida.</p>
  <div class="week-rail" id="weekRail"></div>

  <div class="list" id="list"></div>

  <footer class="note" id="footerNote"></footer>
</div>

<script>
// ---------------------------------------------------------------------
// Modo admin: se activa solo si la URL trae ?admin=CLAVE_SECRETA
// Cambia ADMIN_TOKEN por lo que quieras antes de compartir el link admin.
// Ejemplo de link admin:  archivo.html?admin=starlab-hh-2026
// Link normal (para clientes): archivo.html  (sin el parámetro)
// ---------------------------------------------------------------------
const ADMIN_TOKEN = 'starlab-hh-2026';
const IS_ADMIN = new URLSearchParams(window.location.search).get('admin') === ADMIN_TOKEN;

const BASE_TZ = 'America/Santiago';
const STORAGE_KEY_TZ = 'accountability:tz';

const slots = [
  { day:'Lunes',     rrDay:'MO', dow:1, inicio:'16:00', fin:'17:30', enlace:'https://meet.google.com/mqq-zgqy-njm' },
  { day:'Martes',    rrDay:'TU', dow:2, inicio:'09:00', fin:'11:00', enlace:'https://meet.google.com/nzs-hfqm-wum' },
  { day:'Martes',    rrDay:'TU', dow:2, inicio:'16:00', fin:'17:30', enlace:'https://meet.google.com/mqq-zgqy-njm' },
  { day:'Miércoles', rrDay:'WE', dow:3, inicio:'16:00', fin:'17:30', enlace:'https://meet.google.com/mqq-zgqy-njm' },
  { day:'Jueves',    rrDay:'TH', dow:4, inicio:'09:00', fin:'10:00', enlace:'https://meet.google.com/vez-hovd-tbr' },
  { day:'Viernes',   rrDay:'FR', dow:5, inicio:'16:00', fin:'17:30', enlace:'https://meet.google.com/mqq-zgqy-njm' },
];

// Solo Occidente: de España a California, pasando por Latinoamérica y EE.UU.
const WESTERN_ZONES = [
  'Europe/Madrid','Europe/Lisbon',
  'America/Sao_Paulo','America/Buenos_Aires','America/Montevideo',
  'America/Santiago','America/La_Paz','America/Bogota','America/Lima','America/Guayaquil',
  'America/Panama','America/Guatemala','America/Mexico_City',
  'America/New_York','America/Chicago','America/Denver','America/Los_Angeles'
];

const WEEKDAY_ORDER_ES = ['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];

function pad(n){ return String(n).padStart(2,'0'); }
function getZonesList(){ return WESTERN_ZONES; }
function capitalize(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function slotKey(slot){ return `${slot.day}-${slot.inicio}`; }

function zonedWallTimeToUtc(year, month, day, hour, minute, timeZone){
  const naiveUTC = Date.UTC(year, month - 1, day, hour, minute, 0);
  const asIfUTC = new Date(naiveUTC);
  const tzString = asIfUTC.toLocaleString('en-US', { timeZone });
  const utcString = asIfUTC.toLocaleString('en-US', { timeZone: 'UTC' });
  const offset = new Date(utcString).getTime() - new Date(tzString).getTime();
  return new Date(naiveUTC + offset);
}

function getSantiagoTodayParts(){
  const now = new Date();
  const fmt = new Intl.DateTimeFormat('en-CA', { timeZone: BASE_TZ, year:'numeric', month:'2-digit', day:'2-digit' });
  const [y,m,d] = fmt.format(now).split('-').map(Number);
  const dow = new Date(Date.UTC(y, m-1, d)).getUTCDay();
  return { y, m, d, dow, now };
}

function nextOccurrenceInstant(slot){
  const { y, m, d, dow, now } = getSantiagoTodayParts();
  let diff = (slot.dow - dow + 7) % 7;
  let target = new Date(Date.UTC(y, m-1, d + diff));
  if(diff === 0){
    const [hF, mF] = slot.fin.split(':').map(Number);
    const endInstant = zonedWallTimeToUtc(y, m, d, hF, mF, BASE_TZ);
    if(now > endInstant){
      target = new Date(Date.UTC(y, m-1, d + 7));
    }
  }
  const ty = target.getUTCFullYear(), tm = target.getUTCMonth()+1, td = target.getUTCDate();
  const [hI,mI] = slot.inicio.split(':').map(Number);
  const [hF,mF] = slot.fin.split(':').map(Number);
  const dateISO = `${ty}-${pad(tm)}-${pad(td)}`;
  return {
    start: zonedWallTimeToUtc(ty, tm, td, hI, mI, BASE_TZ),
    end: zonedWallTimeToUtc(ty, tm, td, hF, mF, BASE_TZ),
    dateISO
  };
}

function toICSFmt(dateObj){
  return dateObj.getUTCFullYear() + pad(dateObj.getUTCMonth()+1) + pad(dateObj.getUTCDate()) + 'T' +
         pad(dateObj.getUTCHours()) + pad(dateObj.getUTCMinutes()) + '00Z';
}

function googleCalUrl(slot, start, end){
  const text = encodeURIComponent(`Accountability — ${slot.day} (hora Chile)`);
  const details = encodeURIComponent(`Sesión semanal de Accountability.\nEnlace: ${slot.enlace}`);
  const location = encodeURIComponent(slot.enlace);
  const recur = encodeURIComponent(`RRULE:FREQ=WEEKLY;BYDAY=${slot.rrDay}`);
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${text}&dates=${toICSFmt(start)}/${toICSFmt(end)}&details=${details}&location=${location}&recur=${recur}`;
}

function downloadICS(slot, start, end){
  const ics = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Starlab//Horario Accountability//ES',
    'BEGIN:VEVENT',
    `UID:${slot.day}-${slot.inicio}@starlab-accountability`,
    `DTSTAMP:${toICSFmt(new Date())}`,
    `DTSTART:${toICSFmt(start)}`,
    `DTEND:${toICSFmt(end)}`,
    `RRULE:FREQ=WEEKLY;BYDAY=${slot.rrDay}`,
    `SUMMARY:Accountability — ${slot.day} (hora Chile)`,
    `DESCRIPTION:Sesión semanal de Accountability.\\nEnlace: ${slot.enlace}`,
    `LOCATION:${slot.enlace}`,
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
  const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Accountability_${slot.day}_${slot.inicio.replace(':','')}.ics`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function minutesInZone(instant, tz){
  const parts = new Intl.DateTimeFormat('en-US', { timeZone: tz, hour:'2-digit', minute:'2-digit', hour12:false })
    .formatToParts(instant).reduce((acc,p)=>{acc[p.type]=p.value;return acc;},{});
  let hh = parseInt(parts.hour,10);
  if(hh === 24) hh = 0;
  return hh*60 + parseInt(parts.minute,10);
}

function weekdayInZone(instant, tz){
  const name = new Intl.DateTimeFormat('es-ES', { timeZone: tz, weekday:'long' }).format(instant).toLowerCase();
  return { idx: WEEKDAY_ORDER_ES.indexOf(name), label: capitalize(name) };
}

// ---- Cancelaciones (compartidas: visibles para cualquiera que abra esta página) ----
function cancelStorageKey(slot, dateISO){ return `cancelacion:${slotKey(slot)}:${dateISO}`; }

async function getCancelInfo(slot, dateISO){
  try{
    const res = await window.storage.get(cancelStorageKey(slot, dateISO), true);
    return res && res.value ? JSON.parse(res.value) : null;
  }catch(e){ return null; }
}

async function setCancelled(slot, dateISO, motivo){
  await window.storage.set(cancelStorageKey(slot, dateISO), JSON.stringify({
    cancelled:true, motivo: motivo || '', ts: Date.now()
  }), true);
}

async function unsetCancelled(slot, dateISO){
  try{ await window.storage.delete(cancelStorageKey(slot, dateISO), true); }catch(e){}
}

window.handleCancelClick = async function(slotIdx, dateISO, dayLabel, timeLabel){
  if(!IS_ADMIN) return;
  const ok = confirm(`¿Cancelar la sesión de ${dayLabel} (${timeLabel})?\n\nEsto se mostrará a cualquiera que abra el link normal (sin admin).`);
  if(!ok) return;
  const motivo = prompt('Motivo de la cancelación (opcional, se mostrará junto al aviso):', '') || '';
  await setCancelled(slots[slotIdx], dateISO, motivo);
  await renderAll(currentTz);
};

window.handleUncancelClick = async function(slotIdx, dateISO){
  if(!IS_ADMIN) return;
  const ok = confirm('¿Reactivar esta sesión (deshacer la cancelación)?');
  if(!ok) return;
  await unsetCancelled(slots[slotIdx], dateISO);
  await renderAll(currentTz);
};

// ---- Render ----
let currentTz = BASE_TZ;

async function buildItems(){
  const raw = slots.map((slot, idx) => {
    const occ = nextOccurrenceInstant(slot);
    return { slot, idx, ...occ };
  });
  const withCancel = await Promise.all(raw.map(async item => {
    const info = await getCancelInfo(item.slot, item.dateISO);
    return { ...item, cancelInfo: info };
  }));
  return withCancel.sort((a,b) => a.start - b.start);
}

async function renderList(tz, items){
  const list = document.getElementById('list');
  list.innerHTML = items.map(item => {
    const { slot, idx, start, end, dateISO, cancelInfo } = item;
    const { label: dayLabel } = weekdayInZone(start, tz);
    const dateLabel = new Intl.DateTimeFormat('es-ES', { timeZone: tz, day:'numeric', month:'short' }).format(start);
    const timeStart = new Intl.DateTimeFormat('es-ES', { timeZone: tz, hour:'2-digit', minute:'2-digit', hour12:false }).format(start);
    const timeEnd = new Intl.DateTimeFormat('es-ES', { timeZone: tz, hour:'2-digit', minute:'2-digit', hour12:false }).format(end);
    const shifted = dayLabel.toLowerCase() !== slot.day.toLowerCase();
    const isCancelled = !!(cancelInfo && cancelInfo.cancelled);
    const timeLabelPlain = `${timeStart}–${timeEnd}`;

    let actionsHtml = '';
    if(isCancelled){
      if(IS_ADMIN){
        actionsHtml = `<button class="btn btn-ghost" onclick="handleUncancelClick(${idx}, '${dateISO}')">Deshacer cancelación</button>`;
      }
      // clientes: sin botones, solo la etiqueta/motivo de arriba
    }else{
      actionsHtml = `
        <a class="btn btn-teal" href="${slot.enlace}" target="_blank" rel="noopener">Unirse</a>
        <a class="btn btn-ghost" href="${googleCalUrl(slot, start, end)}" target="_blank" rel="noopener">+ Google Calendar</a>
        <button class="btn btn-ghost" onclick='downloadICSFromList(${JSON.stringify(slot)}, "${start.toISOString()}", "${end.toISOString()}")'>.ics</button>
        ${IS_ADMIN ? `<button class="btn btn-red-outline" onclick="handleCancelClick(${idx}, '${dateISO}', '${dayLabel} ${dateLabel}', '${timeLabelPlain}')">Cancelar sesión</button>` : ''}
      `;
    }

    return `
      <div class="slot-card ${isCancelled ? 'cancelada' : ''}">
        <div class="slot-day ${isCancelled ? 'cancelada-text' : ''}">${dayLabel} <span style="font-weight:400;font-size:12px;color:var(--ink-soft);">${dateLabel}</span></div>
        <div class="slot-time ${isCancelled ? 'cancelada-text' : ''}">${timeStart} – ${timeEnd}</div>
        ${!isCancelled && shifted ? `<span class="slot-shift">Chile: ${slot.day} ${slot.inicio}</span>` : ''}
        ${isCancelled ? `<span class="slot-cancel-tag">❌ Cancelada</span>` : ''}
        ${isCancelled && cancelInfo.motivo ? `<div class="slot-reason">Motivo: ${cancelInfo.motivo}</div>` : ''}
        <div class="slot-actions">${actionsHtml}</div>
      </div>
    `;
  }).join('');
}
window.downloadICSFromList = function(slot, startIso, endIso){
  downloadICS(slot, new Date(startIso), new Date(endIso));
};

function renderRail(tz, items){
  const rail = document.getElementById('weekRail');
  const note = document.getElementById('railNote');
  note.textContent = `Franja visual en hora de ${tz.replace(/_/g,' ')}.`;

  const converted = items.map(item => {
    const { idx, label } = weekdayInZone(item.start, tz);
    return {
      ...item, weekdayIdx: idx, weekdayLabel: label,
      startMin: minutesInZone(item.start, tz),
      endMin: minutesInZone(item.end, tz)
    };
  });

  const allMins = converted.flatMap(c => [c.startMin, c.endMin]);
  let rangeStart = Math.max(0, Math.floor(Math.min(...allMins) / 60) * 60 - 60);
  let rangeEnd = Math.min(24*60, Math.ceil(Math.max(...allMins) / 60) * 60 + 60);
  const totalRange = rangeEnd - rangeStart;
  const hourCount = Math.round(totalRange / 60);

  const dayGroups = {};
  converted.forEach(c => {
    dayGroups[c.weekdayIdx] = dayGroups[c.weekdayIdx] || { label: c.weekdayLabel, items: [] };
    dayGroups[c.weekdayIdx].items.push(c);
  });
  const orderedIdx = Object.keys(dayGroups).map(Number).sort((a,b)=>a-b);

  let html = `<div></div><div class="rail-hours" style="grid-template-columns:repeat(${hourCount},1fr);">`;
  for(let m = rangeStart; m < rangeEnd; m += 60){ html += `<span>${Math.floor(m/60)}</span>`; }
  html += `</div>`;

  orderedIdx.forEach(idx => {
    const group = dayGroups[idx];
    html += `<div class="rail-day-label">${group.label}</div><div class="rail-track">`;
    group.items.forEach(c => {
      const left = ((c.startMin - rangeStart) / totalRange) * 100;
      const width = ((c.endMin - c.startMin) / totalRange) * 100;
      const isCancelled = !!(c.cancelInfo && c.cancelInfo.cancelled);
      html += `<div class="rail-block ${isCancelled ? 'cancelada' : ''}" style="left:${left}%;width:${width}%;" title="${c.slot.inicio}-${c.slot.fin} hora Chile${isCancelled ? ' — CANCELADA' : ''}" onclick="${isCancelled ? '' : `window.open('${c.slot.enlace}','_blank')`}">
        ${pad(Math.floor(c.startMin/60))}:${pad(c.startMin%60)}
      </div>`;
    });
    html += `</div>`;
  });
  rail.innerHTML = html;
}

function renderAlertBanner(items){
  const banner = document.getElementById('alertBanner');
  const list = document.getElementById('alertList');
  const cancelled = items.filter(i => i.cancelInfo && i.cancelInfo.cancelled);
  if(cancelled.length === 0){
    banner.classList.remove('show');
    list.innerHTML = '';
    return;
  }
  list.innerHTML = cancelled.map(i => {
    const dateLabel = new Intl.DateTimeFormat('es-ES', { timeZone: currentTz, day:'numeric', month:'short' }).format(i.start);
    const timeLabel = new Intl.DateTimeFormat('es-ES', { timeZone: currentTz, hour:'2-digit', minute:'2-digit', hour12:false }).format(i.start);
    return `<li>${i.slot.day} ${dateLabel}, ${timeLabel}${i.cancelInfo.motivo ? ' — ' + i.cancelInfo.motivo : ''}</li>`;
  }).join('');
  banner.classList.add('show');
}

function updateTzBase(tz){
  const now = new Date();
  let offset = '';
  try{
    offset = new Intl.DateTimeFormat('en-US', { timeZone: tz, timeZoneName: 'shortOffset' })
      .formatToParts(now).find(p=>p.type==='timeZoneName').value;
  }catch(e){}
  document.getElementById('tzBase').innerHTML = `Base: <strong>Chile (America/Santiago)</strong> · Viendo: <strong>${tz.replace(/_/g,' ')}</strong> ${offset}`;
}

function renderFooter(){
  document.getElementById('footerNote').innerHTML = IS_ADMIN
    ? `Los bloques se repiten cada semana. "+ Google Calendar" y ".ics" crean el evento recurrente en el horario correcto para cualquier zona en la que se abra.<br>
       Las cancelaciones que marques aquí son visibles para cualquiera que abra el link normal (sin el parámetro admin).`
    : `Los bloques se repiten cada semana. "+ Google Calendar" y ".ics" crean el evento recurrente en el horario correcto para cualquier zona en la que se abra.<br>
       Si una sesión aparece cancelada, tu coach ya está al tanto y te contactará para reprogramar si es necesario.`;
}

async function renderAll(tz){
  currentTz = tz;
  updateTzBase(tz);
  const items = await buildItems();
  renderAlertBanner(items);
  renderRail(tz, items);
  await renderList(tz, items);
}

async function populateTzSelect(){
  document.getElementById('adminFlag').style.display = IS_ADMIN ? 'inline' : 'none';
  renderFooter();

  const select = document.getElementById('tzSelect');
  const zones = getZonesList();
  select.innerHTML = zones.map(z => `<option value="${z}">${z.replace(/_/g,' ')}</option>`).join('');

  let saved = null;
  try{
    const res = await window.storage.get(STORAGE_KEY_TZ);
    saved = res && res.value ? res.value : null;
  }catch(e){}

  const browserTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const initial = (saved && zones.includes(saved)) ? saved
    : (zones.includes(browserTz) ? browserTz : BASE_TZ);
  select.value = initial;

  select.addEventListener('change', async ()=>{
    const tz = select.value;
    await renderAll(tz);
    try{ await window.storage.set(STORAGE_KEY_TZ, tz); }catch(e){}
  });

  document.getElementById('btnMiZona').addEventListener('click', async ()=>{
    if(zones.includes(browserTz)){
      select.value = browserTz;
      await renderAll(browserTz);
      try{ await window.storage.set(STORAGE_KEY_TZ, browserTz); }catch(e){}
    }else{
      alert('Tu zona horaria actual no está en el rango de Occidente configurado (España a California).');
    }
  });

  await renderAll(select.value);
}

populateTzSelect();
</script>
</body>
